name: drh_setif_tracker
description: "نظام تتبع المفتشين — مديرية التجارة الداخلية وضبط السوق الوطنية لولاية سطيف"
publish_to: 'none'

version: 1.0.10+11

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.1
  geolocator: ^11.0.0
  http: ^1.1.0
  intl: ^0.20.2
  shared_preferences: ^2.2.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  image_picker: ^1.0.4
  qr_flutter: ^4.1.0
  flutter_localizations:
    sdk: flutter
  pdf: ^3.12.0
  printing: ^5.14.0
  postgres: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
          weight: 400
